<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales CRM</title>
<meta name="theme-color" content="#1f5c45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!--HEAD_END-->
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#efeee9; --text:#1d1f1e; --muted:#6a6f6c; --line:#dcdad3;
  --accent:#1f5c45; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --red:#b3261e; --red-soft:#fbe4e1; --amber:#9a5b00; --amber-soft:#fdf0d8; --blue:#1d5fa8; --blue-soft:#e2ecf8; --green:#1e7a4c; --green-soft:#e0f2e8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#8a5cd1; --c5:#d4a20c; --c6:#d1497b; --c7:#4aa3b5; --c8:#1E7B3E;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141615; --surface:#1d201f; --surface2:#262a28; --text:#e8eae8; --muted:#9aa19d; --line:#333835;
    --accent:#5fbf95; --accent-ink:#0d1f17; --accent-soft:#1f3b2f;
    --red:#ff8a80; --red-soft:#3d1f1c; --amber:#f2b552; --amber-soft:#3a2d14; --blue:#8ab8ee; --blue-soft:#1b2a3d; --green:#6fd39d; --green-soft:#183326;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1d201f; --surface2:#262a28; --text:#e8eae8; --muted:#9aa19d; --line:#333835;
  --accent:#5fbf95; --accent-ink:#0d1f17; --accent-soft:#1f3b2f;
  --red:#ff8a80; --red-soft:#3d1f1c; --amber:#f2b552; --amber-soft:#3a2d14; --blue:#8ab8ee; --blue-soft:#1b2a3d; --green:#6fd39d; --green-soft:#183326;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:17px;margin:0;font-weight:600;flex:1}
.sync{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;color:inherit;padding:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.dot.ok{background:#7ee2a8}.dot.dirty{background:#f2c14e}.dot.err{background:#ff8a80}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px;position:relative}
nav.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav.tabs a.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;min-width:17px;line-height:17px;font-weight:600}
main{max-width:1000px;margin:0 auto;padding:14px 16px}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:92px}
  nav.tabs{top:0;bottom:0;right:auto;width:92px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:70px}
  nav.tabs a{flex:0;padding:12px 2px}
  header.top{margin-left:-92px;padding-left:108px}
}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px}
.pad{padding:12px 14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.list .item{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.list .item:first-child{border-top:0}
.list .item:hover{background:var(--surface2)}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.paid{background:var(--green);color:#fff}.chip.unpaid{background:var(--red);color:#fff}
.chip.red{background:var(--red-soft);color:var(--red)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.blue{background:var(--blue-soft);color:var(--blue)}.chip.green{background:var(--green-soft);color:var(--green)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:3px;font-size:15px;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:14px}
.check input{width:18px;height:18px}
.kpis.custk{grid-template-columns:repeat(3,minmax(96px,max-content)) 1fr;gap:8px}
.kpis.custk .kpi.sm{padding:7px 10px}.kpis.custk .kpi.sm .v{font-size:16px}.kpis.custk .kpi.sm .l{font-size:11.5px}
.kpis.custk .cnotes textarea{resize:vertical}
@media (max-width:600px){.kpis.custk{grid-template-columns:repeat(3,1fr)}.kpis.custk .cnotes{grid-column:1 / -1}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.kpi .v{font-size:20px;font-weight:650}
.kpi .l{font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 8px;border-top:1px solid var(--line);text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.line{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart text{fill:var(--muted);font-size:11px}
svg.chart .grid{stroke:var(--line)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.alert-h{display:flex;align-items:center;gap:8px}
.sum{font-size:14px;margin-top:6px}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <h1 id="htitle">Sales CRM</h1>
  <button class="sync" id="syncBtn" title="Sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Local</span></button>
</header>
<nav class="tabs" id="tabs">
  <a href="#orders" data-t="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg>Orders</a>
  <a href="#customers" data-t="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 20c0-3-2-5-4-5.5"/></svg>Customers</a>
  <a href="#products" data-t="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Products</a>
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Alerts<span class="badge hide" id="badge"></span></a>
  <a href="#more" data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>More</a>
</nav>
<main id="app"></main>
<script>
"use strict";
const SEED = null;
const APP_VERSION = "1.9";
const DB_KEY="crm.db.v1", AUTH_KEY="crm.auth.v1", COLS=["customers","products","orders","activities"];
const DBX_FILE="/crm-data.json";

/* ---------- storage ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
let db=null;
function emptyDb(){return {customers:[],products:[],orders:[],activities:[],settings:{alertDays:7,cutoff:"2026-09-01",prevSalesman:"Michelangelo Delogu",updatedAt:"1970-01-01T00:00:00.000Z"},meta:{dirty:false,lastSync:null,lastBackupDay:null}}}
function loadDb(){
  const raw=lsGet(DB_KEY);
  if(raw){try{db=JSON.parse(raw)}catch(e){db=null}}
  if(!db){db=emptyDb(); if(SEED){for(const c of COLS) db[c]=JSON.parse(JSON.stringify(SEED[c]||[]));} saveDb(false);}
  for(const c of COLS) db[c]=db[c]||[];
  db.settings=Object.assign({alertDays:7,cutoff:"2026-09-01",prevSalesman:"Michelangelo Delogu",updatedAt:"1970-01-01T00:00:00.000Z"},db.settings||{});
  normalizeDb();
  db.meta=Object.assign({dirty:false,lastSync:null,lastBackupDay:null},db.meta||{});
}
function saveDb(markDirty=true){
  if(markDirty) db.meta.dirty=true;
  if(!lsSet(DB_KEY,JSON.stringify(db))) toast("Could not save on this device (storage blocked)");
  updateSyncUi(); if(markDirty) scheduleSync();
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

function migrateCustomer(c){
  if(!Array.isArray(c.contacts)){
    c.contacts=[];
    if(c.contact||c.phone||c.phone2||c.email) c.contacts.push({id:c.id+"_k1",name:c.contact||"",role:"",phone:c.phone||"",phone2:c.phone2||"",email:c.email||""});
    c.mainContact=c.contacts.length?c.contacts[0].id:"";
  }
  if(c.contacts.length&&!c.contacts.some(k=>k.id===c.mainContact)) c.mainContact=c.contacts[0].id;
}
function normalizeDb(){ for(const c of db.customers) migrateCustomer(c); }
function mainContact(c){return (c.contacts||[]).find(k=>k.id===c.mainContact)||(c.contacts||[])[0]||null}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nowIso(){return new Date().toISOString()}
function todayStr(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/86400000)}
function fDate(s){if(!s)return "—";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y}
const nf2=new Intl.NumberFormat("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const nfq=new Intl.NumberFormat("it-IT",{maximumFractionDigits:2});
function eur(v){return "€ "+nf2.format(v||0)}
function ql(v){return nfq.format(v||0)+" ql"}
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function live(c){return db[c].filter(x=>!x.deleted)}
function byId(c,id){return db[c].find(x=>x.id===id)}
function custName(id){const c=byId("customers",id);return c?c.name:"?"}
function prodBySku(s){return db.products.find(p=>p.sku===s&&!p.deleted)}
function upsert(col,rec){rec.updatedAt=nowIso();const i=db[col].findIndex(x=>x.id===rec.id);if(i>=0)db[col][i]=rec;else db[col].push(rec);saveDb();}
function remove(col,id){const r=byId(col,id);if(r){r.deleted=true;r.updatedAt=nowIso();saveDb();}}

/* ---------- business logic ---------- */
function lineNet(l){return (+l.listPrice||0)*(1-(+l.disc||0))}
function orderQty(o){return o.lines.reduce((s,l)=>s+(+l.qty||0),0)}
function orderNet(o){return o.lines.reduce((s,l)=>s+(+l.qty||0)*lineNet(l),0)}
function orderTotal(o){return orderNet(o)*(1+(+o.vat||0)/100)}
function cutoff(){return db.settings.cutoff||"2026-09-01"}
function isMine(o){return (o.date||"")>=cutoff()}
function tracked(o){return o.status!=="cancelled" && !o.noTrack && isMine(o)}
function dueDate(o){
  const base=o.invoiceDate||o.deliveryDate||o.date; if(!base) return null;
  const days=+o.termsDays||0;
  if(o.termsType==="FM"){ // last Friday of the month of the base date, plus days (same as the SALES LOG formula)
    const b=parseD(base); const e=new Date(b.getFullYear(),b.getMonth()+1,0);
    const back=(e.getDay()-5+7)%7; e.setDate(e.getDate()-back); return addDays(ymd(e),days);
  }
  return addDays(base,days);
}
function payState(o){
  if(!tracked(o)) return null;
  if(o.paid) return {k:"paid"};
  const due=dueDate(o), t=todayStr(), d=diffDays(due,t);
  if(d<0) return {k:"overdue",days:-d,due};
  if(d<=db.settings.alertDays) return {k:"soon",days:d,due};
  return {k:"open",days:d,due};
}
function statusChip(o){
  if(o.status==="cancelled") return `<span class="chip">Cancelled</span>`;
  if(!isMine(o)) return `<span class="chip" title="${esc(db.settings.prevSalesman)}">${esc(initials(db.settings.prevSalesman))}</span>`;
  return "";
}
function initials(n){return String(n||"").split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+".").join("")}
function oneLine(t){return String(t||"").replace(/\s*\n\s*/g," · ")}
function prodName(sku){return (prodBySku(sku)||{}).name||sku}
function isPaid(o){ return isMine(o) ? !!o.paid : !(o.invoiceNo && !o.paid); }
function paidChip(o){ if(o.status==="cancelled") return ""; return isPaid(o)?`<span class="chip paid">PAID</span>`:`<span class="chip unpaid">UNPAID</span>`; }
function payChip(o){
  const p=payState(o); if(!p) return "";
  if(p.k==="paid") return `<span class="chip green">Paid</span>`;
  if(p.k==="overdue") return `<span class="chip red">Overdue ${p.days} d</span>`;
  if(p.k==="soon") return `<span class="chip amber">Due ${p.days===0?"today":"in "+p.days+" d"}</span>`;
  return `<span class="chip">Due ${fDate(p.due)}</span>`;
}
function byName(a,b){return String(a).localeCompare(String(b),"it",{sensitivity:"base"})}
function soldMap(){const m={};for(const o of live("orders"))if(o.status!=="cancelled")for(const l of o.lines)m[l.sku]=(m[l.sku]||0)+(+l.qty||0);return m}
function byPopularity(m){return (a,b)=>((m[b.sku]||0)-(m[a.sku]||0))||byName(a.name,b.name)}
function custUnpaidBrand(cid){
  const r={Lario:{tot:0,over:0,old:0},Borgo:{tot:0,over:0,old:0}};
  for(const o of live("orders")) if(o.customerId===cid&&o.status!=="cancelled"&&!isMine(o)&&!isPaid(o))
    for(const l of o.lines){const b=isLario(l.sku)?"Lario":"Borgo"; r[b].old+=(+l.qty||0)*lineNet(l)*(1+(+o.vat||0)/100);}
  for(const o of live("orders")) if(o.customerId===cid){const p=payState(o); if(p&&p.k!=="paid"){
    for(const l of o.lines){const b=isLario(l.sku)?"Lario":"Borgo"; const v=(+l.qty||0)*lineNet(l)*(1+(+o.vat||0)/100); r[b].tot+=v; if(p.k==="overdue")r[b].over+=v;}}}
  return r;
}
function custOrders(cid){return live("orders").filter(o=>o.customerId===cid&&o.status!=="cancelled").sort((a,b)=>a.date<b.date?-1:1)}
function custCycle(cid){
  const dates=[...new Set(custOrders(cid).map(o=>o.date))].sort();
  const last=dates[dates.length-1]||null;
  if(dates.length<2) return {last,cycle:null,next:null,count:dates.length};
  const gaps=[]; for(let i=1;i<dates.length;i++) gaps.push(diffDays(dates[i],dates[i-1]));
  const g=gaps.slice(-6).sort((a,b)=>a-b); const mid=Math.floor(g.length/2);
  const cycle=Math.max(7,Math.round(g.length%2?g[mid]:(g[mid-1]+g[mid])/2));
  return {last,cycle,next:addDays(last,cycle),count:dates.length};
}
function custUnpaid(cid){
  let tot=0,over=0; for(const o of live("orders")) if(o.customerId===cid){const p=payState(o); if(p&&p.k!=="paid"){tot+=orderTotal(o); if(p.k==="overdue")over+=orderTotal(o);}}
  return {tot,over};
}
function computeAlerts(){
  const t=todayStr(), N=db.settings.alertDays, A={overdue:[],soon:[],follow:[],expected:[],lapsed:[]};
  for(const o of live("orders")){const p=payState(o); if(!p)continue; if(p.k==="overdue")A.overdue.push({o,p}); else if(p.k==="soon")A.soon.push({o,p});}
  A.overdue.sort((a,b)=>b.p.days-a.p.days); A.soon.sort((a,b)=>a.p.days-b.p.days);
  for(const a of live("activities")) if(a.followUp&&!a.done&&diffDays(a.followUp,t)<=N) A.follow.push(a);
  A.follow.sort((a,b)=>a.followUp<b.followUp?-1:1);
  for(const c of live("customers")){
    if(c.inactive) continue;
    const cy=custCycle(c.id); if(!cy.next) continue;
    const since=diffDays(t,cy.last), until=diffDays(cy.next,t);
    if(since>cy.cycle*3) A.lapsed.push({c,cy,since});
    else if(until<=N) A.expected.push({c,cy,until,since});
  }
  A.expected.sort((a,b)=>a.until-b.until); A.lapsed.sort((a,b)=>a.since-b.since);
  return A;
}
function nextOrderNo(){
  let m=0; for(const o of db.orders){const r=/^SO-(\d+)$/.exec(o.number||""); if(r)m=Math.max(m,+r[1]);}
  return "SO-"+String(m+1).padStart(5,"0");
}

/* ---------- charts (inline SVG) ---------- */
const WARM=["#E8B400","#F07C1E","#D7263D","#8C1C2E","#7B3FA0"];          // Lario: yellow, orange, red, burgundy, purple
const COLD=["#3F3DB5","#1E6FD9","#5BB8F0","#14B8A6","#7CCF5B","#1E7B3E"]; // Borgo / Mol.Ind.: indigo, blue, light blue, aqua green, light green, dark green
function isLario(sku){const p=prodBySku(sku);return p?((p.brand||"").toLowerCase()==="lario"):/^L/.test(sku)}
function prodColor(sku){
  const all=live("products").filter(p=>isLario(p.sku)===isLario(sku)).map(p=>p.sku).sort();
  const pal=isLario(sku)?WARM:COLD; const i=Math.max(0,all.indexOf(sku)); return pal[i%pal.length];
}
function colorSeries(series){let w=0,c=0; for(const se of series){ if(!se.sku) continue; se.color=isLario(se.sku)?WARM[w++%WARM.length]:COLD[c++%COLD.length]; } return series;}
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)","var(--c8)"];
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function stackedBars(labels,series,unit){
  const W=Math.max(320,labels.length*50+50),H=220,L=44,B=24,T=10,cw=(W-L-8)/labels.length;
  const tot=labels.map((_,i)=>series.reduce((s,se)=>s+Math.max(0,se.values[i]||0),0));
  const mx=niceMax(Math.max(...tot,0)); const y=v=>T+(H-T-B)*(1-v/mx);
  let g=""; for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${nfq.format(v)}</text>`}
  let bars=""; labels.forEach((lab,i)=>{let acc=0;const x=L+i*cw+cw*.18,w=cw*.64;
    series.forEach((se,si)=>{const v=Math.max(0,se.values[i]||0);if(!v)return;const y1=y(acc+v),y0=y(acc);bars+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1,y0-y1)}" fill="${se.color||PAL[si%8]}" rx="2"><title>${esc(se.name)} · ${esc(lab)}: ${nfq.format(v)} ${unit}</title></rect>`;acc+=v});
    if(labels.length<=31 && (labels.length<=14||i%2===0)) bars+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  const leg=series.length>1?`<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||PAL[i%8]}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
  return `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${labels.length>8?Math.min(W,560):0}px;max-height:260px">${g}${bars}</svg></div>${leg}`;
}
function hBars(rows,fmt){
  const mx=Math.max(...rows.map(r=>r.v),0)||1;
  return rows.map(r=>`<${r.href?`a href="${r.href}" style="display:block;margin:6px 0;color:inherit;text-decoration:none"`:'div style="margin:6px 0"'}><div class="row small"><span class="grow">${esc(r.label)}</span><span class="num">${fmt(r.v)}</span></div><div style="height:7px;background:var(--surface2);border-radius:4px"><div style="height:7px;border-radius:4px;background:${r.color||"var(--c1)"};width:${(r.v/mx*100).toFixed(1)}%"></div></div></${r.href?"a":"div"}>`).join("");
}

let sPeriod="12m", sMeasure="qty";
function vStats(app){
  const t=todayStr(), years=[...new Set(live("orders").map(o=>o.date.slice(0,4)))].sort().reverse();
  let from,to=t,months=[];
  if(sPeriod==="12m"){const d=parseD(t);d.setDate(1);d.setMonth(d.getMonth()-11);from=ymd(d);}
  else if(sPeriod==="new"){from=cutoff();}
  else {from=sPeriod+"-01-01";to=sPeriod+"-12-31";}
  {const d=parseD(from);d.setDate(1);while(ymd(d).slice(0,7)<=to.slice(0,7)){months.push(ymd(d).slice(0,7));d.setMonth(d.getMonth()+1);}}
  const O=live("orders").filter(o=>o.status!=="cancelled"&&o.date>=from&&o.date<=to);
  const val=(o,l)=>sMeasure==="qty"?(+l.qty||0):(+l.qty||0)*lineNet(l);
  const fmt=v=>sMeasure==="qty"?ql(v):eur(v);
  const totQ=O.reduce((s,o)=>s+orderQty(o),0), totN=O.reduce((s,o)=>s+orderNet(o),0);
  const brands=[...new Set(live("products").map(p=>p.brand||"Other"))];
  const series=brands.map(b=>({name:b,color:b.toLowerCase()==="lario"?WARM[1]:COLD[1],values:months.map(m=>O.filter(o=>o.date.slice(0,7)===m).reduce((s,o)=>s+o.lines.filter(l=>((prodBySku(l.sku)||{}).brand||"Other")===b).reduce((x,l)=>x+val(o,l),0),0))})).filter(s=>s.values.some(v=>v));
  const byC={},byP={}; for(const o of O) for(const l of o.lines){byC[o.customerId]=(byC[o.customerId]||0)+val(o,l);byP[l.sku]=(byP[l.sku]||0)+val(o,l);}
  const cRows=Object.entries(byC).map(([k,v])=>({label:custName(k),v,href:"#customer/"+k})).sort((a,b)=>byName(a.label,b.label));
  const pRows=Object.entries(byP).map(([k,v])=>({label:((prodBySku(k)||{}).name||k)+" ("+k+")",v,color:prodColor(k)})).sort((a,b)=>b.v-a.v);
  // customer x month matrix
  const custIds=Object.keys(byC).sort((a,b)=>byName(custName(a),custName(b)));
  const mat=custIds.map(cid=>({cid,vals:months.map(m=>O.filter(o=>o.customerId===cid&&o.date.slice(0,7)===m).reduce((s,o)=>s+o.lines.reduce((x,l)=>x+val(o,l),0),0))}));
  app.innerHTML=`<h2>Stats</h2>
  <div class="toolbar"><div class="seg" id="per">${[["12m","Last 12 months"],...years.map(y=>[y,y]),["new","New Mgmt"]].map(([v,l])=>`<button data-v="${v}" class="${sPeriod===v?"on":""}">${l}</button>`).join("")}</div>
  <div class="seg" id="mea"><button data-v="qty" class="${sMeasure==="qty"?"on":""}">Quintals</button><button data-v="eur" class="${sMeasure==="eur"?"on":""}">€ net</button></div></div>
  <div class="kpis"><div class="kpi"><div class="v">${ql(totQ)}</div><div class="l">Quantity</div></div><div class="kpi"><div class="v">${eur(totN)}</div><div class="l">Net sales (excl. IVA)</div></div><div class="kpi"><div class="v">${O.length}</div><div class="l">Orders</div></div><div class="kpi"><div class="v">${Object.keys(byC).length}</div><div class="l">Customers buying</div></div></div>
  <h3>By month</h3><div class="card pad">${stackedBars(months.map(m=>MONTHS[+m.slice(5)-1]+" "+m.slice(2,4)),series,sMeasure==="qty"?"ql":"€")}</div>
  <h3>By customer</h3><div class="card pad">${hBars(cRows,fmt)||`<div class="empty">No data</div>`}</div>
  <h3>By product</h3><div class="card pad">${hBars(pRows,fmt)||`<div class="empty">No data</div>`}</div>
  <h3>Customer × month</h3><div class="card scroll"><table class="t"><tr><th>Customer</th>${months.map(m=>`<th class="n">${MONTHS[+m.slice(5)-1]} ${m.slice(2,4)}</th>`).join("")}<th class="n">Total</th></tr>
  ${mat.map(r=>`<tr><td><a href="#customer/${r.cid}">${esc(custName(r.cid))}</a></td>${r.vals.map(v=>`<td class="n">${v?nfq.format(Math.round(v*100)/100):""}</td>`).join("")}<td class="n"><b>${nfq.format(Math.round(byC[r.cid]*100)/100)}</b></td></tr>`).join("")}</table></div>`;
  $("#per").querySelectorAll("button").forEach(b=>b.onclick=()=>{sPeriod=b.dataset.v;render()});
  $("#mea").querySelectorAll("button").forEach(b=>b.onclick=()=>{sMeasure=b.dataset.v;render()});
}

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);}
function exportData(){const o={app:"sales-crm",version:1,exportedAt:nowIso(),settings:db.settings};for(const c of COLS)o[c]=db[c];return o}
function exportCsv(){
  const rows=[["Order no","Date","Customer","SKU","Product","Qty (ql)","List price","Discount %","Net price","Line net","IVA %","Status","Invoice no","Invoice date","Terms days","Terms","Due date","Paid","Paid on","Notes"]];
  for(const o of live("orders").sort((a,b)=>a.date<b.date?-1:1)) for(const l of o.lines) rows.push([o.number,o.date,custName(o.customerId),l.sku,(prodBySku(l.sku)||{}).name||"",l.qty,l.listPrice,(l.disc*100).toFixed(2),lineNet(l).toFixed(2),((+l.qty||0)*lineNet(l)).toFixed(2),o.vat,o.status,o.invoiceNo,o.invoiceDate,o.termsDays,o.termsType,tracked(o)?dueDate(o):"",o.paid?"yes":"no",o.paidDate,o.notes]);
  download("orders-"+todayStr()+".csv","﻿"+rows.map(r=>r.map(v=>{v=String(v==null?"":v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n"),"text/csv");
}
function normName(n){return String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function applyPatch(l,r){
  for(const [k,v] of Object.entries(r)){
    if(["id","_patch","contactsAdd","updatedAt"].includes(k))continue;
    if(v!==""&&v!=null&&!l[k]) l[k]=v; // only fill empty fields, never overwrite your edits
  }
  if(r.contactsAdd){ migrateCustomer(l);
    for(const k of r.contactsAdd){
      const ex=l.contacts.find(x=>normName(x.name)===normName(k.name));
      if(ex){for(const f of ["role","phone","phone2","email"]) if(k[f]&&!ex[f]&&![ex.phone,ex.phone2].includes(k[f])) ex[f]=k[f];}
      else l.contacts.push(Object.assign({id:uid("k"),role:"",phone:"",phone2:"",email:""},k));
    }
    if(!l.mainContact&&l.contacts.length)l.mainContact=l.contacts[0].id;
  }
  l.updatedAt=nowIso();
}
function mergeInto(remote,fromFile){
  let changed=false, patched=0;
  for(const c of COLS){
    const map=new Map(db[c].map(x=>[x.id,x]));
    for(const r of (remote[c]||[])){
      const l=map.get(r.id);
      if(r._patch){ if(fromFile&&l){applyPatch(l,r);patched++;changed=true;} continue; }
      if(!l||(r.updatedAt||"")>(l.updatedAt||"")){map.set(r.id,r);changed=true;}
    }
    db[c]=[...map.values()];
  }
  if(remote.settings&&(remote.settings.updatedAt||"")>(db.settings.updatedAt||"")){db.settings=Object.assign({},db.settings,remote.settings);changed=true;}
  normalizeDb();
  return fromFile?{changed,patched}:changed;
}

/* ---------- Dropbox (OAuth PKCE + files API) ---------- */
function auth(){try{return JSON.parse(lsGet(AUTH_KEY)||"null")}catch(e){return null}}
function setAuth(a){lsSet(AUTH_KEY,JSON.stringify(a))}
function redirectUri(){return location.origin+location.pathname.replace(/index\.html$/,"")}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function dbxConnect(appKey){
  try{
    const ver=b64url(crypto.getRandomValues(new Uint8Array(48)));
    const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
    setAuth({appKey,verifier:ver});
    const u="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:appKey,response_type:"code",code_challenge:ch,code_challenge_method:"S256",token_access_type:"offline",redirect_uri:redirectUri()});
    location.href=u;
  }catch(e){alert("Could not start the Dropbox connection here: "+e.message)}
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search); const code=p.get("code"); if(!code&&!p.get("error"))return;
  history.replaceState(null,"",redirectUri()+location.hash);
  if(!code){toast("Dropbox connection cancelled");return}
  const a=auth()||{};
  try{
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams({code,grant_type:"authorization_code",code_verifier:a.verifier,client_id:a.appKey,redirect_uri:redirectUri()})});
    const j=await r.json(); if(!r.ok)throw new Error(j.error_description||j.error||r.status);
    setAuth({appKey:a.appKey,refresh:j.refresh_token,access:j.access_token,exp:Date.now()+(j.expires_in-60)*1000});
    toast("Dropbox connected"); await sync(true); render();
  }catch(e){alert("Dropbox connection failed: "+e.message)}
}
async function token(){
  const a=auth(); if(!a||!a.refresh)return null;
  if(a.access&&a.exp>Date.now())return a.access;
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams({grant_type:"refresh_token",refresh_token:a.refresh,client_id:a.appKey})});
  const j=await r.json(); if(!r.ok)throw new Error(j.error_description||j.error||("token "+r.status));
  a.access=j.access_token;a.exp=Date.now()+(j.expires_in-60)*1000;setAuth(a);return a.access;
}
async function dbxDownload(path){
  const t=await token();
  const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+t,"Dropbox-API-Arg":JSON.stringify({path})}});
  if(r.status===409)return null; if(!r.ok)throw new Error("download "+r.status);
  return JSON.parse(await r.text());
}
async function dbxUpload(path,obj){
  const t=await token();
  const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path,mode:"overwrite",mute:true})},body:new TextEncoder().encode(JSON.stringify(obj))});
  if(!r.ok)throw new Error("upload "+r.status);
}
let syncing=false,syncErr=null,syncTimer=null;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),4000)}
async function sync(manual){
  const a=auth(); if(!a||!a.refresh){if(manual)toast("Dropbox is not connected");return}
  if(!navigator.onLine){if(manual)toast("Offline: changes are saved here and will sync later");return}
  if(syncing)return; syncing=true; updateSyncUi();
  try{
    const remote=await dbxDownload(DBX_FILE);
    const changed=remote?mergeInto(remote):false;
    await dbxUpload(DBX_FILE,exportData());
    const day=todayStr();
    if(db.meta.lastBackupDay!==day){await dbxUpload("/backups/crm-"+day+".json",exportData());db.meta.lastBackupDay=day;}
    db.meta.dirty=false; db.meta.lastSync=nowIso(); syncErr=null; saveDb(false);
    if(changed){applyProductInfo(); render();}
    if(manual) toast("Synced with Dropbox");
  }catch(e){syncErr=e.message; if(manual)toast("Sync failed: "+e.message);}
  syncing=false; updateSyncUi();
}
async function backupNow(){try{await dbxUpload("/backups/crm-"+todayStr()+"-"+new Date().toTimeString().slice(0,5).replace(":","")+".json",exportData());toast("Backup saved to Dropbox")}catch(e){toast("Backup failed: "+e.message)}}
function updateSyncUi(){
  const a=auth(),dot=$("#syncDot"),tx=$("#syncTxt"); if(!dot||!db)return;
  dot.className="dot";
  if(!a||!a.refresh){tx.textContent=db.meta.dirty?"Saved on device":"Local";return}
  if(syncing){tx.textContent="Syncing…";return}
  if(syncErr){dot.classList.add("err");tx.textContent=navigator.onLine?"Sync error":"Offline";return}
  if(!navigator.onLine){dot.classList.add("dirty");tx.textContent="Offline";return}
  if(db.meta.dirty){dot.classList.add("dirty");tx.textContent="Not synced";return}
  dot.classList.add("ok");tx.textContent="Synced";
}

window.addEventListener("offline",updateSyncUi);

  for(const inf of PRODUCT_INFO){
    let p=db.products.find(x=>x.sku===inf.sku&&!x.deleted);
    if(!p){ p={id:inf.id,sku:inf.sku,name:inf._name,price:inf._price,brand:inf._brand,unit:"ql"}; db.products.push(p); }
    let ch=!p.updatedAt;
    for(const k of ["description","category","manufacturer","pack"]) if(inf[k]&&p[k]!==inf[k]){p[k]=inf[k];ch=true;}
    if(ch){p.updatedAt=nowIso();n++;}
  }
  db.meta.productInfo=PRODUCT_INFO_ID;
  saveDb(n>0);
}
/* ---------- start ---------- */
applyTheme(); loadDb(); if(live("products").length) applyProductInfo(); updateSyncUi(); render(); handleRedirect(); sync(false);
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
